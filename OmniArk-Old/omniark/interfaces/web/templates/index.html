<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniArk 主控台</title>
    <!-- OmniArk build: {{ asset_version }}（每次启动变化，可用于确认界面新鲜度） -->
    <link rel="icon" type="image/x-icon" href="/static/PCSMT2.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>{{ inline_css | safe }}</style>
</head>
<body>
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="/static/PCSMT2.ico" alt="OmniArk Logo" class="sidebar-logo">
            <div class="sidebar-brand">
                <span class="sidebar-name">OmniArk</span>
                <span class="sidebar-subtitle">PCSMT-2 重构版</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="#/dashboard" class="nav-item" data-route="dashboard">
                <i class="bi bi-speedometer2"></i><span>仪表盘</span>
            </a>
            <a href="#/console" class="nav-item" data-route="console">
                <i class="bi bi-grid-1x2-fill"></i><span>总控台</span>
            </a>
            <a href="#/servers" class="nav-item" data-route="servers">
                <i class="bi bi-hdd-stack"></i><span>服务器</span>
            </a>
            <a href="#/create" class="nav-item" data-route="create">
                <i class="bi bi-plus-square"></i><span>创建服务器</span>
            </a>
            <a href="#/settings" class="nav-item" data-route="settings">
                <i class="bi bi-gear"></i><span>设置</span>
            </a>
            <a href="#/java" class="nav-item" data-route="java">
                <i class="bi bi-cup-hot"></i><span>Java 管理</span>
            </a>
            <a href="#/accounts" class="nav-item" data-route="accounts">
                <i class="bi bi-person-gear"></i><span>账号管理</span>
            </a>
            <a href="#/help" class="nav-item" data-route="help">
                <i class="bi bi-question-circle"></i><span>API 帮助</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-account" id="sidebar-account" style="display:none">
                <i class="bi bi-person-circle"></i>
                <span class="sidebar-account-name" id="sidebar-account-name">…</span>
                <span class="role-badge role-user" id="sidebar-account-role"></span>
            </div>
            <a href="/logout" class="nav-item nav-logout">
                <i class="bi bi-box-arrow-right"></i><span>退出登录</span>
            </a>
            <div class="sidebar-version">版本 <span id="sidebar-version">…</span></div>
        </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- 主内容区 -->
    <div class="main-wrapper">
        <header class="topbar">
            <button class="btn-icon sidebar-toggle" id="sidebar-toggle" aria-label="切换侧边栏">
                <i class="bi bi-list"></i>
            </button>
            <h1 class="topbar-title" id="page-title">仪表盘</h1>
            <span class="topbar-version">v<span id="topbar-version">…</span></span>
        </header>
        <main class="content" id="app"></main>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>

    <!-- 确认弹窗 -->
    <div class="modal fade" id="confirm-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirm-modal-title">确认操作</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body" id="confirm-modal-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" id="confirm-modal-ok">确认</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 全局加载遮罩 -->
    <div class="loading-overlay d-none" id="loading-overlay">
        <div class="loading-box">
            <div class="spinner-border text-accent" role="status"></div>
            <p class="loading-text" id="loading-text">处理中，请稍候…</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script>{{ inline_js | safe }}</script>
</body>
</html>
