<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniArk | {{ title }}</title>
    <link rel="icon" href="/static/PCSMT2.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/common-dark.css?v={{ asset_version }}">
    <link rel="stylesheet" href="/static/css/chart.css?v={{ asset_version }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
    <nav class="oa-navbar">
        <a class="oa-brand" href="/">
            <img src="/static/PCSMT2.ico" alt="OmniArk">
            <span>OmniArk</span>
        </a>
        <span class="oa-page-title"><i class="bi bi-graph-up"></i> 存储占用 — {{ server_name }}</span>
        <span class="oa-nav-spacer"></span>
        <a class="oa-back-link" href="/"><i class="bi bi-arrow-left"></i> 返回主控台</a>
    </nav>

    <main class="chart-page">
        <div class="chart-header">
            <h1>{{ title }}</h1>
            <p>服务器目录占用空间的历史记录</p>
        </div>

        <!-- 统计卡片 -->
        <div class="chart-stats">
            <div class="stat-card">
                <div class="stat-icon latest"><i class="bi bi-clock-history"></i></div>
                <div>
                    <div class="stat-label">最新占用</div>
                    <div class="stat-value" id="stat-latest">—</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon max"><i class="bi bi-arrow-up-circle"></i></div>
                <div>
                    <div class="stat-label">最大占用</div>
                    <div class="stat-value" id="stat-max">—</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon avg"><i class="bi bi-bar-chart-line"></i></div>
                <div>
                    <div class="stat-label">平均占用</div>
                    <div class="stat-value" id="stat-avg">—</div>
                </div>
            </div>
        </div>

        <!-- 折线图 -->
        <div class="oa-card chart-card">
            <h2 class="oa-card-title"><i class="bi bi-graph-up-arrow"></i> 占用趋势</h2>
            <div class="chart-box" id="chart-box">
                <canvas id="storageChart"></canvas>
            </div>
            <div class="chart-empty" id="chart-empty" style="display:none;">
                <i class="bi bi-database-x"></i>
                <span id="chart-empty-text">暂无存储占用记录</span>
            </div>
        </div>
    </main>

    <script>
        window.CHART_SERVER_NAME = {{ server_name | tojson }};
        window.CHART_TITLE = {{ title | tojson }};
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/ui.js?v={{ asset_version }}"></script>
    <script src="/static/js/chart.js?v={{ asset_version }}"></script>
</body>
</html>
