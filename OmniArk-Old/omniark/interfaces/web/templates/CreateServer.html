<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/PCSMT2.ico">
    <title>OmniArk | 创建服务器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/common-dark.css?v={{ asset_version }}">
    <link rel="stylesheet" href="/static/css/createserver.css?v={{ asset_version }}">
</head>
<body>
    <nav class="oa-navbar">
        <a class="oa-brand" href="/">
            <img src="/static/PCSMT2.ico" alt="OmniArk">
            <span>OmniArk</span>
        </a>
        <span class="oa-page-title"><i class="bi bi-plus-square"></i> 创建服务器</span>
        <span class="oa-nav-spacer"></span>
        <a class="oa-back-link" href="/"><i class="bi bi-arrow-left"></i> 返回主控台</a>
    </nav>

    <main class="create-page">
        <div class="create-card">
            <h1>创建服务器</h1>
            <p class="subtitle">填写以下信息，一键创建 Minecraft 服务器</p>

            <form class="create-form" action="/server/create" method="post" id="create-form" autocomplete="off">
                <div class="form-group">
                    <label class="oa-label" for="serverName">服务器名</label>
                    <input type="text" class="oa-input" id="serverName" name="serverName"
                           placeholder="例如：survival-01" required>
                </div>

                <div class="form-group">
                    <label class="oa-label">核心类型</label>
                    <div class="core-type-grid">
                        <div class="core-type-card">
                            <input type="radio" id="core-official" name="coreType" value="official" checked>
                            <label for="core-official"><i class="bi bi-box"></i> 官方</label>
                        </div>
                        <div class="core-type-card">
                            <input type="radio" id="core-forge" name="coreType" value="forge">
                            <label for="core-forge"><i class="bi bi-hammer"></i> Forge</label>
                        </div>
                        <div class="core-type-card">
                            <input type="radio" id="core-fabric" name="coreType" value="fabric">
                            <label for="core-fabric"><i class="bi bi-grid-3x3-gap"></i> Fabric</label>
                        </div>
                        <div class="core-type-card">
                            <input type="radio" id="core-mohist" name="coreType" value="mohist">
                            <label for="core-mohist"><i class="bi bi-layers"></i> Mohist</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="oa-label" for="version-filter">核心版本</label>
                    <div class="version-dropdown">
                        <input type="text" class="oa-input" id="version-filter"
                               placeholder="输入以搜索版本，如 1.20" autocomplete="off">
                        <input type="hidden" id="coreVersion" name="coreVersion" required>
                        <div class="version-list" id="version-list"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="oa-label" for="port">端口号</label>
                    <input type="number" class="oa-input" id="port" name="port"
                           min="1024" max="65535" value="25565" required>
                </div>

                <div class="form-group">
                    <label class="oa-label">默认游戏模式</label>
                    <div class="game-mode-grid">
                        <div class="game-mode-option">
                            <input type="radio" id="gm-survival" name="gameMode" value="survival" checked>
                            <label for="gm-survival">生存</label>
                        </div>
                        <div class="game-mode-option">
                            <input type="radio" id="gm-creative" name="gameMode" value="creative">
                            <label for="gm-creative">创造</label>
                        </div>
                        <div class="game-mode-option">
                            <input type="radio" id="gm-adventure" name="gameMode" value="adventure">
                            <label for="gm-adventure">冒险</label>
                        </div>
                        <div class="game-mode-option">
                            <input type="radio" id="gm-spectator" name="gameMode" value="spectator">
                            <label for="gm-spectator">旁观</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <div class="switch-row">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="pvpEnabled"
                                   name="pvpEnabled" value="true" checked>
                            <input type="hidden" name="pvpEnabled" value="false">
                            <label class="form-check-label" for="pvpEnabled">启用 PVP</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="onlineMode"
                                   name="onlineMode" value="true">
                            <input type="hidden" name="onlineMode" value="false">
                            <label class="form-check-label" for="onlineMode">启用正版验证</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="oa-btn oa-btn-primary create-submit" id="create-btn">
                    <i class="bi bi-rocket-takeoff"></i> 创建服务器
                </button>
            </form>
        </div>
    </main>

    <div id="loadingOverlay">
        <div class="spinner-border" role="status"></div>
        <p>正在创建服务器，请稍候…</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/ui.js?v={{ asset_version }}"></script>
    <script src="/static/js/createserver.js?v={{ asset_version }}"></script>
</body>
</html>
