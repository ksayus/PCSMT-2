<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniArk | 服务器设置 - {{ server_name }}</title>
    <link rel="icon" href="/static/PCSMT2.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/common-dark.css?v={{ asset_version }}">
    <link rel="stylesheet" href="/static/css/serversettings.css?v={{ asset_version }}">
</head>
<body>
    <nav class="oa-navbar">
        <a class="oa-brand" href="/">
            <img src="/static/PCSMT2.ico" alt="OmniArk">
            <span>OmniArk</span>
        </a>
        <span class="oa-page-title"><i class="bi bi-gear"></i> 服务器设置 — {{ server_name }}</span>
        <span class="oa-nav-spacer"></span>
        <a class="oa-back-link" href="/"><i class="bi bi-arrow-left"></i> 返回主控台</a>
    </nav>

    <main class="settings-page">
        <div class="settings-header">
            <h1>修改 {{ server_name }} 服务器配置</h1>
            <p>修改 server.properties 与启动内存，保存后立即写入配置文件。</p>
        </div>

        <form id="server-settings-form" autocomplete="off">
            <!-- 基本设置 -->
            <section class="oa-card">
                <h2 class="oa-card-title"><i class="bi bi-sliders"></i> 基本设置</h2>
                <div class="settings-grid">
                    <div class="field">
                        <label class="oa-label" for="serverName">服务器名</label>
                        <input type="text" class="oa-input" id="serverName" name="serverName"
                               value="{{ server_name }}" required>
                    </div>
                    <div class="field">
                        <label class="oa-label" for="server-port">服务器端口</label>
                        <input type="number" class="oa-input" id="server-port" name="server-port"
                               min="1" max="65535" required>
                    </div>
                </div>
            </section>

            <!-- 内存设置 -->
            <section class="oa-card">
                <h2 class="oa-card-title"><i class="bi bi-memory"></i> 内存设置</h2>
                <div class="settings-grid">
                    <div class="field">
                        <label class="oa-label" for="min-memory">最小内存（MB）</label>
                        <input type="number" class="oa-input" id="min-memory" name="min-memory"
                               min="256" required>
                    </div>
                    <div class="field">
                        <label class="oa-label" for="max-memory">最大内存（MB）</label>
                        <input type="number" class="oa-input" id="max-memory" name="max-memory"
                               min="256" required>
                    </div>
                </div>
            </section>

            <!-- 游戏玩法 -->
            <section class="oa-card">
                <h2 class="oa-card-title"><i class="bi bi-controller"></i> 游戏玩法</h2>
                <div class="settings-grid">
                    <div class="field">
                        <label class="oa-label" for="gamemode">游戏模式</label>
                        <select class="oa-select" id="gamemode" name="gamemode">
                            <option value="survival">生存</option>
                            <option value="creative">创造</option>
                            <option value="adventure">冒险</option>
                            <option value="spectator">旁观</option>
                        </select>
                    </div>
                    <div class="field">
                        <label class="oa-label" for="difficulty">难度</label>
                        <select class="oa-select" id="difficulty" name="difficulty">
                            <option value="peaceful">和平</option>
                            <option value="easy">简单</option>
                            <option value="normal">普通</option>
                            <option value="hard">困难</option>
                        </select>
                    </div>
                    <div class="field">
                        <label class="oa-label" for="max-players">最大玩家数</label>
                        <input type="number" class="oa-input" id="max-players" name="max-players" min="1" required>
                    </div>
                    <div class="field">
                        <label class="oa-label" for="max-world-size">最大世界大小（方块）</label>
                        <input type="number" class="oa-input" id="max-world-size" name="max-world-size"
                               min="1" max="29999984" required>
                    </div>
                    <div class="field">
                        <label class="oa-label" for="spawn-protection">出生点保护范围</label>
                        <input type="number" class="oa-input" id="spawn-protection" name="spawn-protection"
                               min="0" max="32767" required>
                    </div>
                </div>
                <div class="settings-switches mt-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="spawn-monsters" name="spawn-monsters">
                        <label class="form-check-label" for="spawn-monsters">生成怪物</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="pvp" name="pvp">
                        <label class="form-check-label" for="pvp">开启 PVP</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="allow-flight" name="allow-flight">
                        <label class="form-check-label" for="allow-flight">允许飞行</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="enable-command-block" name="enable-command-block">
                        <label class="form-check-label" for="enable-command-block">启用命令方块</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="hardcore" name="hardcore">
                        <label class="form-check-label" for="hardcore">硬核模式</label>
                    </div>
                </div>
            </section>

            <!-- 网络与安全 -->
            <section class="oa-card">
                <h2 class="oa-card-title"><i class="bi bi-shield-lock"></i> 网络与安全</h2>
                <div class="settings-switches">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="white-list" name="white-list">
                        <label class="form-check-label" for="white-list">启用白名单</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="online-mode" name="online-mode">
                        <label class="form-check-label" for="online-mode">在线模式（正版验证）</label>
                    </div>
                </div>
            </section>

            <div class="settings-submit-bar">
                <a class="oa-btn oa-btn-ghost" href="/"><i class="bi bi-x-lg"></i> 取消</a>
                <button type="submit" class="oa-btn oa-btn-primary" id="save-btn">
                    <i class="bi bi-check-lg"></i> 保存设置
                </button>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/ui.js?v={{ asset_version }}"></script>
    <script>
        const SERVER_NAME = {{ server_name | tojson }};
        const form = document.getElementById('server-settings-form');
        const saveBtn = document.getElementById('save-btn');

        // 回填 server.properties（后端返回 key=value 的 JSON 对象）
        async function loadProperties() {
            try {
                const data = await oaApi(`/api/server/get/document/server.properties/${encodeURIComponent(SERVER_NAME)}`);
                for (const [key, value] of Object.entries(data)) {
                    const el = document.getElementById(key);
                    if (!el) continue;
                    if (el.type === 'checkbox') {
                        el.checked = String(value) === 'true';
                    } else {
                        el.value = value;
                    }
                }
            } catch (err) {
                oaToast(`获取服务器配置失败：${err.message}`, 'error');
            }
        }

        // 回填启动内存 {min, max}
        async function loadMemory() {
            try {
                const data = await oaApi(`/api/server/get/run_memory/${encodeURIComponent(SERVER_NAME)}`);
                document.getElementById('min-memory').value = data.min;
                document.getElementById('max-memory').value = data.max;
            } catch (err) {
                oaToast(`获取内存配置失败：${err.message}`, 'error');
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const minMem = Number(document.getElementById('min-memory').value);
            const maxMem = Number(document.getElementById('max-memory').value);
            if (minMem > maxMem) {
                oaToast('最小内存不能大于最大内存', 'error');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 保存中...';
            try {
                const data = await oaApi(`/api/server/set/settings/${encodeURIComponent(SERVER_NAME)}`, {
                    method: 'POST',
                    body: new FormData(form),
                });
                oaToast(data.message || '设置已保存', 'success');
                // 若服务器被重命名，刷新到新的设置页
                const newName = document.getElementById('serverName').value.trim();
                if (newName && newName !== SERVER_NAME) {
                    setTimeout(() => {
                        window.location.href = `/server/settings/${encodeURIComponent(newName)}`;
                    }, 800);
                }
            } catch (err) {
                oaToast(`保存失败：${err.message}`, 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="bi bi-check-lg"></i> 保存设置';
            }
        });

        loadProperties();
        loadMemory();
    </script>
</body>
</html>
