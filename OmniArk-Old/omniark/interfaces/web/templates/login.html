<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniArk 管理员认证 | 登录</title>
    <link rel="icon" type="image/x-icon" href="/static/PCSMT2.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login.css?v={{ asset_version }}">
</head>
<body>
    <div class="login-card">
        <div class="login-brand">
            <img src="/static/PCSMT2.ico" alt="OmniArk Logo" class="login-logo">
            <h1 class="login-title">OmniArk</h1>
            <p class="login-subtitle">Minecraft 服务器管理主控台</p>
        </div>

        {% if error %}
        <div class="login-error">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" class="needs-validation" novalidate id="login-form">
            <div class="mb-3">
                <label for="admin_account" class="form-label">管理员账号</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="admin_account"
                           name="admin_account" placeholder="请输入账号" required autofocus>
                    <div class="invalid-feedback">请输入管理员账号</div>
                </div>
            </div>

            <div class="mb-4">
                <label for="admin_password" class="form-label">密码</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="admin_password"
                           name="admin_password" placeholder="请输入密码" required>
                    <div class="invalid-feedback">请输入密码</div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 login-btn" id="login-btn">
                <span class="login-btn-text"><i class="bi bi-box-arrow-in-right me-1"></i>登录</span>
                <span class="spinner-border spinner-border-sm d-none" id="login-spinner"></span>
            </button>
        </form>

        <p class="login-footer">PCSMT-2 重构版</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/login.js?v={{ asset_version }}"></script>
</body>
</html>
