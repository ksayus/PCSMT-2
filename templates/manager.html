<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/icon" href="/static/PCSMT2.ico">
    <title>PCSMT2 | 文件管理器 - {{ server_info.name }}</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/manager.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link rel="stylesheet" href="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="https://cdn.bootcss.com/jquery/1.12.4/jquery.min.js"></script>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <i href="/">
                <img src="/static/PCSMT2.ico" alt="Logo" class="sidebar-logo">
            </i>
            <span class="sidebar-name">PCSMT2</span>
        </div>
        <ul>
            <li><a href="/">返回首页</a></li>
            <li><a href="/server/{{ server_info.name }}">返回服务器</a></li>
        </ul>
    </nav>

    <div class="content">
        <div class="file-manager-container">
            <div class="directory-panel">
                <div class="panel-header">
                    <h3>源目录</h3>
                    <span class="panel-path" id="left-panel-path">{{ server_info.Path | replace("\\", "/") }}</span>
                </div>
                <div class="panel-toolbar">
                    <button onclick="createFileInLeft()" title="新建文件"><i class="fas fa-file"></i></button>
                    <button onclick="createFolderInLeft()" title="新建文件夹"><i class="fas fa-folder"></i></button>
                    <button onclick="deleteSelectedInLeft()" title="删除选中项" style="color: #e74c3c;"><i class="fas fa-trash"></i></button>
                    <button onclick="refreshLeftPanel()" title="刷新"><i class="fas fa-sync"></i></button>
                    <button onclick="navigateLeftPanelUp()" title="返回上级"><i class="fas fa-level-up-alt"></i></button>
                </div>
                <div class="directory-tree" id="left-directory-tree">
                </div>
                <div class="file-list" id="left-file-list">
                </div>
                <div class="panel-status">
                    <span id="left-file-count">0 个项目</span>
                    <span id="left-selected-count">已选择 0 个项目</span>
                </div>
            </div>
            
            <div class="transfer-buttons">
                <button onclick="copyToRight()" title="复制到右侧">
                    <i class="fas fa-arrow-right"></i><br>复制
                </button>
                <button onclick="moveToRight()" title="移动到右侧">
                    <i class="fas fa-arrow-right"></i><br>移动
                </button>
                <div style="margin: 20px 0;"></div>
                <button onclick="copyToLeft()" title="复制到左侧">
                    <i class="fas fa-arrow-left"></i><br>复制
                </button>
                <button onclick="moveToLeft()" title="移动到左侧">
                    <i class="fas fa-arrow-left"></i><br>移动
                </button>
            </div>
            
            <div class="directory-panel">
                <div class="panel-header">
                    <h3>目标目录</h3>
                    <span class="panel-path" id="right-panel-path">{{ server_info.Path | replace("\\", "/") }}</span>
                </div>
                <div class="panel-toolbar">
                    <button onclick="createFileInRight()" title="新建文件"><i class="fas fa-file"></i></button>
                    <button onclick="createFolderInRight()" title="新建文件夹"><i class="fas fa-folder"></i></button>
                    <button onclick="deleteSelectedInRight()" title="删除选中项" style="color: #e74c3c;"><i class="fas fa-trash"></i></button>
                    <button onclick="refreshRightPanel()" title="刷新"><i class="fas fa-sync"></i></button>
                    <button onclick="navigateRightPanelUp()" title="返回上级"><i class="fas fa-level-up-alt"></i></button>
                </div>
                <div class="directory-tree" id="right-directory-tree">
                </div>
                <div class="file-list" id="right-file-list">
                </div>
                <div class="panel-status">
                    <span id="right-file-count">0 个项目</span>
                    <span id="right-selected-count">已选择 0 个项目</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.SERVER_PATH = '{{ server_info.Path | replace("\\", "/") }}';
        window.SERVER_NAME = '{{ server_info.Name }}';
    </script>
    <script src="/static/js/manager.js"></script>
</body>
</html>
